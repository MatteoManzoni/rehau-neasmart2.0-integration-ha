name: Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test tools
        run: python -m pip install ruff

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Lint Python
        run: ruff check custom_components/rehau_neasmart2 tests

      - name: Validate Python and JSON files
        run: |
          python -m compileall -q custom_components tests
          python -m json.tool custom_components/rehau_neasmart2/manifest.json >/dev/null
          python -m json.tool custom_components/rehau_neasmart2/strings.json >/dev/null
          python -m json.tool custom_components/rehau_neasmart2/translations/en.json >/dev/null
          python -m json.tool custom_components/rehau_neasmart2/translations/it.json >/dev/null

  hassfest:
    name: Hassfest validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run hassfest validation
        uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS validation
    runs-on: ubuntu-latest
    steps:
      - name: Run HACS validation
        uses: hacs/action@22.5.0
        with:
          category: integration
          comment: false
          ignore: brands
